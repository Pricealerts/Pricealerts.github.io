<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />

		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<meta name="author" content="Price Alerts" />
		<meta name="robots" content="index, follow" />
		<!-- OG Meta for Social shares -->
		<meta property="og:url" content="https://pricealerts.web.app/" />
		<meta property="og:type" content="website" />
		<meta
			property="og:image"
			content="https://pricealerts.web.app/imgs/web/apple-touch-icon.png"
		/>
		<link rel="canonical" href="https://pricealerts.web.app/index.html" />
		<!-- end OG Meta for Social shares -->
		<title>المنبه اليومي</title>
		<link rel="stylesheet" href="https://pricealerts.github.io/style.min.css" />
		<!-- Poure applecation -->
		<!-- <link rel="manifest" href="./manifest.json" /> -->
		<meta name="theme-color" content="#f0f2f5" />
		<link
			rel="icon"
			href="https://pricealerts.github.io/imgs/web/favicon.ico"
			sizes="any"
		/>
		<link
			rel="apple-touch-icon"
			href="https://pricealerts.github.io/imgs/web/apple-touch-icon.png"
		/>
		<link
			rel="shortcut icon"
			type="image/x-icon"
			href="https://pricealerts.github.io/imgs/web/apple-touch-icon.png"
		/>

		<!-- end pour app -->
	</head>

	<body>
		<div class="container pirantCntynr">
			<div id="dadi"></div>
			<h2 class="hTitel">المنبه اليومي</h2>
			<br />

			<div class="exchange-selection">
				<label for="anny"> التاريخ:</label>
				<input
					type="date"
					id="birthdate"
					name="birthdate"
					min="2020-01-01"
					max="2030-12-31"
					style="text-align: center"
					required
				/>
			</div>

			<div class="alert-section">
				<h2>إعدادات المنبه</h2>
				<br />
				<label for="object"> الموضوع :</label>
				<input id="object" class="txt" placeholder="الموضوع" step="any" required />
				<br /><br />
				<label for="txt"> محتوى التنبيه :</label>
				<textarea
					id="txt"
					class="txt"
					placeholder="محتوى التنبيه "
					style="width: 100%; height: 100px; padding: 10px;"
				></textarea>

				<div id="telegramChatIdContainer">
					<p id="telegramChatIdNote" class="small-note" style="display: none">
						<strong>ملاحظة:</strong> إذا لم يكن لديك معرف دردشة تيليجرام،
						<a href="https://t.me/Price_alets08_bot" target="_blank"
							>أدخل الى هذا البوت</a
						>
						للحصول على معرف دردشتك.
						<br />
					</p>
					<label for="telegramChatId"
						>معرّف دردشة التيليجرام (Chat ID) :
					</label>
					<select id="chtIdSlct" style="display: none"></select>
					<input
						type="text"
						id="telegramChatId"
						placeholder="أدخل معرّف دردشة تيليجرام"
					/>
				</div>

				<button id="setAlertButton">تعيين تنبيه</button>
				<p id="alertStatus"></p>
			</div>

			<div class="active-alerts-section">
				<h2>التنبيهات النشطة </h2>
				<ul id="alertsList">
					<li class="no-alerts-message">لا توجد تنبيهات نشطة حاليًا.</li>
				</ul>
			</div>

		</div>

		<script src="js.js"></script>
	</body>
</html>
